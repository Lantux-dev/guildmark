name: Fallo / Bug
description: Algo no funciona como debería · Something is not working as it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por avisar. Puedes escribir en español o en inglés.
        Thanks for reporting. Spanish or English are both fine.
  - type: textarea
    id: what
    attributes:
      label: ¿Qué ha pasado? · What happened?
      description: Qué estabas haciendo y qué esperabas que pasara. · What you were doing and what you expected.
    validations:
      required: true
  - type: textarea
    id: errors
    attributes:
      label: Errores · Errors
      description: |
        En el juego escribe `/gmk errores`, pulsa «Seleccionar todo», copia con Ctrl+C y pégalo aquí.
        In game type `/gmk errors`, click "Select all", copy with Ctrl+C and paste it here.
      render: text
  - type: input
    id: version
    attributes:
      label: Versión de Guildmark · Guildmark version
      description: Sale al final de Ajustes y en la primera línea de `/gmk errores`. · Shown at the bottom of Settings and on the first line of `/gmk errors`.
      placeholder: "0.9.2"
  - type: dropdown
    id: where
    attributes:
      label: ¿Dónde? · Where?
      options:
        - Hermandad real · Real guild
        - Modo prueba · Test mode (/gmk prueba)
        - Sin hermandad · No guild
  - type: textarea
    id: extra
    attributes:
      label: Capturas u otros datos · Screenshots or anything else
